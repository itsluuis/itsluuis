name: Generate GitHub Stats

on:
  schedule:
    # Se ejecuta todos los días a medianoche UTC
    - cron: "0 0 * * *"
  # Permite ejecutarlo manualmente con un clic desde la pestaña "Actions"
  workflow_dispatch:
  # Se ejecuta automáticamente al hacer push a la rama principal
  push:
    branches:
      - main

jobs:
  build:
    name: Generate Stats Images
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate GitHub Stats Card
        env:
          GITHUB_USERNAME: itsluuis
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit and Push Generated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update GitHub stats [skip ci]" && git push)
